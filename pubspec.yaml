name: knosis
description: "Knosis — an offline-first reading and language-learning app. From words to worlds."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # State management (AGENTS.md section 13). Plain Riverpod, without the
  # code-generation package, so the repository stays buildable without a
  # build_runner step.
  flutter_riverpod: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
