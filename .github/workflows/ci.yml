# Knosis — Continuous Integration
#
# Toolchain (pinned deliberately, matches the scaffold in .metadata):
#   Flutter 3.47.0 (stable, revision 4cf24164269a5ebf0c16a028a00727d0e77bbb05)
#   Dart 3.13.x (bundled with that Flutter release; pubspec requires ^3.13.0)
#   JDK 17 Temurin (AGP 9.1.0 minimum + default is JDK 17)
#   Gradle 9.3.1 via the wrapper the Flutter tool generates
#
# Stages: checkout -> Java -> Flutter -> Gradle cache -> pub get -> format
#         -> analyze -> test -> Android debug APK -> Android App Bundle (.aab)
#
# NOTE: the `.aab` is built with the *debug* signing config that the default
# Flutter Android template ships with. Real release signing (keystore +
# repository secrets) is a separate, later task and is intentionally not part
# of this baseline.

name: CI

on:
  push:
    branches:
      - main
      # Agent working branches, so CI runs before a PR exists.
      - 'arena/**'
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR to avoid queue pile-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  build-and-test:
    name: Format · Analyze · Test · Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caches the Flutter SDK and the pub package cache.
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Only the default branch writes the shared Gradle cache; branches
          # and PRs read it. Keeps the cache from being churned by every push.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Record toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        # --output=none: report only, never rewrite files in CI.
        run: dart format --output=none --set-exit-if-changed .

        - name: Generate code
        # Drift generated sources are not committed; they are built here so
        # analysis, tests and the Android build see them. Runs after the
        # format check so generated files are never format-gated.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build Android App Bundle
        run: flutter build appbundle

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          # ~110 MB per run; short retention keeps repo storage sane.
          retention-days: 14
